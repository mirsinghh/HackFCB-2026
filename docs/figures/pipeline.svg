<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 910 252' width='100%' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#222831'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#566070'/></marker></defs><rect x='20' y='20' width='170' height='62' rx='6' fill='#f3f5f8' stroke='#9aa3b0'/><text x='105.0' y='42.0' font-size='12' text-anchor='middle' fill='#222831' font-weight='bold'>Tracking (ATD)</text><text x='105.0' y='60.0' font-size='10.5' text-anchor='middle' fill='#6b7280' font-weight='normal'>46 track slots + ball</text><text x='105.0' y='74.0' font-size='10.5' text-anchor='middle' fill='#6b7280' font-weight='normal'>per frame, tactical video</text><rect x='20' y='100' width='170' height='50' rx='6' fill='#f3f5f8' stroke='#9aa3b0'/><text x='105.0' y='122.0' font-size='12' text-anchor='middle' fill='#222831' font-weight='bold'>ATD metadata</text><text x='105.0' y='140.0' font-size='10.5' text-anchor='middle' fill='#6b7280' font-weight='normal'>team of each slot</text><rect x='250' y='8' width='230' height='62' rx='6' fill='#f3f5f8' stroke='#9aa3b0'/><text x='365.0' y='30.0' font-size='12' text-anchor='middle' fill='#222831' font-weight='bold'>Team evidence from the ball</text><text x='365.0' y='48.0' font-size='10.5' text-anchor='middle' fill='#6b7280' font-weight='normal'>nearest home vs nearest away player,</text><text x='365.0' y='62.0' font-size='10.5' text-anchor='middle' fill='#6b7280' font-weight='normal'>down-weighted if the ball is far</text><rect x='250' y='84' width='230' height='62' rx='6' fill='#f3f5f8' stroke='#9aa3b0'/><text x='365.0' y='106.0' font-size='12' text-anchor='middle' fill='#222831' font-weight='bold'>Player-only cue</text><text x='365.0' y='124.0' font-size='10.5' text-anchor='middle' fill='#6b7280' font-weight='normal'>used only where the ball is lost;</text><text x='365.0' y='138.0' font-size='10.5' text-anchor='middle' fill='#6b7280' 